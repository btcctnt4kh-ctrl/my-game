<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>لعبتي</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        #game {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #start-screen {
            position: absolute;
            inset: 0;
            z-index: 10;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            background: #111;
            color: white;
            text-align: center;
        }

        #start-screen h1 {
            margin: 0;
            font-size: clamp(45px, 9vw, 90px);
        }

        #start-screen p {
            color: #aaa;
            font-size: 18px;
            margin-top: 15px;
        }

        #start-button {
            margin-top: 35px;
            padding: 16px 60px;

            border: none;
            border-radius: 10px;

            background: white;
            color: #111;

            font-size: 20px;
            font-weight: bold;

            cursor: pointer;
        }

        #game-world {
            display: none;

            position: absolute;
            inset: 0;

            background: #111;
        }

        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #hud {
            position: absolute;
            top: 20px;
            right: 20px;

            padding: 10px 15px;

            background: rgba(0, 0, 0, 0.55);
            color: white;

            border-radius: 8px;

            font-size: 14px;

            pointer-events: none;
        }

        #hint {
            position: absolute;
            bottom: 25px;
            left: 50%;

            transform: translateX(-50%);

            padding: 10px 18px;

            background: rgba(0, 0, 0, 0.65);
            color: white;

            border-radius: 8px;

            font-size: 14px;

            pointer-events: none;
            white-space: nowrap;
        }

        @media (orientation: portrait) {

            #game-world::before {
                content: "↻ أدر الجوال للوضع الأفقي";

                position: absolute;

                top: 50%;
                left: 50%;

                transform: translate(-50%, -50%);

                z-index: 20;

                padding: 15px 22px;

                background: rgba(0, 0, 0, 0.85);
                color: white;

                border-radius: 10px;

                font-size: 17px;
            }
        }
    </style>
</head>

<body>

    <main id="game">

        <section id="start-screen">

            <h1>لعبتي</h1>

            <p>
                مغامرة • استكشاف • ألغاز
            </p>

            <button id="start-button">
                ابدأ اللعبة
            </button>

        </section>


        <section id="game-world">

            <canvas id="game-canvas"></canvas>

            <div id="hud">
                الغرفة الأولى
            </div>

            <div id="hint">
                تحرك واستكشف المكان
            </div>

        </section>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script>

    <script>

        const startButton = document.getElementById("start-button");
        const startScreen = document.getElementById("start-screen");
        const gameWorld = document.getElementById("game-world");
        const canvas = document.getElementById("game-canvas");

        let scene;
        let camera;
        let renderer;

        startButton.addEventListener("click", startGame);


        function startGame() {

            startScreen.style.display = "none";
            gameWorld.style.display = "block";

            createGame();
        }


        function createGame() {

            scene = new THREE.Scene();

            scene.background = new THREE.Color(0x15191d);


            camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );

            camera.position.set(0, 1.7, 5);


            renderer = new THREE.WebGLRenderer({
                canvas: canvas,
                antialias: true
            });

            renderer.setPixelRatio(
                Math.min(window.devicePixelRatio, 2)
            );

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );


            createLights();
            createRoom();
            createObjects();


            window.addEventListener(
                "resize",
                resizeGame
            );


            animate();
        }


        function createLights() {

            const ambientLight =
                new THREE.AmbientLight(
                    0xffffff,
                    0.7
                );

            scene.add(ambientLight);


            const mainLight =
                new THREE.PointLight(
                    0xffffff,
                    2,
                    30
                );

            mainLight.position.set(
                0,
                4,
                0
            );

            scene.add(mainLight);
        }


        function createRoom() {

            const floorMaterial =
                new THREE.MeshStandardMaterial({
                    color: 0x444444
                });


            const wallMaterial =
                new THREE.MeshStandardMaterial({
                    color: 0x777777
                });


            const floor =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        12,
                        0.2,
                        12
                    ),
                    floorMaterial
                );

            floor.position.y = -0.1;

            scene.add(floor);


            const backWall =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        12,
                        5,
                        0.2
                    ),
                    wallMaterial
                );

            backWall.position.set(
                0,
                2.5,
                -6
            );

            scene.add(backWall);


            const leftWall =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        0.2,
                        5,
                        12
                    ),
                    wallMaterial
                );

            leftWall.position.set(
                -6,
                2.5,
                0
            );

            scene.add(leftWall);


            const rightWall =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        0.2,
                        5,
                        12
                    ),
                    wallMaterial
                );

            rightWall.position.set(
                6,
                2.5,
                0
            );

            scene.add(rightWall);


            const ceiling =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        12,
                        0.2,
                        12
                    ),
                    wallMaterial
                );

            ceiling.position.y = 5;

            scene.add(ceiling);
        }


        function createObjects() {

            const tableMaterial =
                new THREE.MeshStandardMaterial({
                    color: 0x654321
                });


            const table =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        3,
                        0.3,
                        1.5
                    ),
                    tableMaterial
                );

            table.position.set(
                0,
                1,
                -2
            );

            scene.add(table);


            const tableLegs = [
                [-1.2, 0.5, -2.5],
                [1.2, 0.5, -2.5],
                [-1.2, 0.5, -1.5],
                [1.2, 0.5, -1.5]
            ];


            tableLegs.forEach(
                function (position) {

                    const leg =
                        new THREE.Mesh(
                            new THREE.BoxGeometry(
                                0.2,
                                1,
                                0.2
                            ),
                            tableMaterial
                        );

                    leg.position.set(
                        position[0],
                        position[1],
                        position[2]
                    );

                    scene.add(leg);
                }
            );


            const box =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        0.7,
                        0.7,
                        0.7
                    ),
                    new THREE.MeshStandardMaterial({
                        color: 0x222222
                    })
                );

            box.position.set(
                0,
                1.5,
                -2
            );

            scene.add(box);
        }


        function resizeGame() {

            camera.aspect =
                window.innerWidth /
                window.innerHeight;

            camera.updateProjectionMatrix();


            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );
        }


        function animate() {

            requestAnimationFrame(
                animate
            );

            renderer.render(
                scene,
                camera
            );
        }

    </script>

</body>

</html>
