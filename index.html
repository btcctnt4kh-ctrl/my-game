<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>لعبتي</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        #game {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #start-screen {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #111;
            color: white;
            text-align: center;
        }

        #start-screen h1 {
            margin: 0;
            font-size: clamp(45px, 9vw, 90px);
        }

        #start-screen p {
            color: #aaa;
            font-size: 18px;
            margin-top: 15px;
        }

        #start-button {
            margin-top: 35px;
            padding: 16px 60px;
            border: none;
            border-radius: 10px;
            background: white;
            color: #111;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        #game-world {
            display: none;
            position: absolute;
            inset: 0;
            background: #20252a;
        }

        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #hud {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 5;
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.55);
            color: white;
            border-radius: 8px;
            font-size: 14px;
            pointer-events: none;
        }

        #loading {
            position: absolute;
            inset: 0;
            z-index: 8;
            display: none;
            align-items: center;
            justify-content: center;
            color: white;
            background: #20252a;
            font-size: 18px;
        }

        #error {
            position: absolute;
            inset: 0;
            z-index: 9;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 25px;
            color: white;
            background: #181818;
            text-align: center;
            line-height: 1.8;
        }

        @media (orientation: portrait) {
            #game-world::before {
                content: "↻ أدر الجوال للوضع الأفقي";
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                z-index: 20;
                padding: 15px 22px;
                background: rgba(0, 0, 0, 0.85);
                color: white;
                border-radius: 10px;
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

    <main id="game">

        <section id="start-screen">
            <h1>لعبتي</h1>
            <p>مغامرة • استكشاف • ألغاز</p>
            <button id="start-button">ابدأ اللعبة</button>
        </section>

        <section id="game-world">

            <canvas id="game-canvas"></canvas>

            <div id="hud">
                الغرفة الأولى
            </div>

            <div id="loading">
                جاري تحميل اللعبة...
            </div>

            <div id="error">
                تعذر تشغيل محرك اللعبة.<br>
                حدّث الصفحة وحاول مرة أخرى.
            </div>

        </section>

    </main>

    <script type="module">

        const startButton = document.getElementById("start-button");
        const startScreen = document.getElementById("start-screen");
        const gameWorld = document.getElementById("game-world");
        const canvas = document.getElementById("game-canvas");
        const loading = document.getElementById("loading");
        const errorBox = document.getElementById("error");

        let scene;
        let camera;
        let renderer;

        startButton.addEventListener("click", startGame);

        async function startGame() {

            startScreen.style.display = "none";
            gameWorld.style.display = "block";
            loading.style.display = "flex";

            try {

                const THREE = await import(
                    "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
                );

                createGame(THREE);

                loading.style.display = "none";

            } catch (error) {

                console.error(error);

                loading.style.display = "none";
                errorBox.style.display = "flex";

            }
        }

        function createGame(THREE) {

            scene = new THREE.Scene();

            scene.background = new THREE.Color(0x8b9298);

            camera = new THREE.PerspectiveCamera(
                70,
                window.innerWidth / window.innerHeight,
                0.1,
                100
            );

            camera.position.set(0, 1.7, 4);

            renderer = new THREE.WebGLRenderer({
                canvas: canvas,
                antialias: true
            });

            renderer.setPixelRatio(
                Math.min(window.devicePixelRatio, 2)
            );

            renderer.setSize(
                window.innerWidth,
                window.innerHeight
            );

            const ambientLight =
                new THREE.AmbientLight(0xffffff, 1.5);

            scene.add(ambientLight);

            const mainLight =
                new THREE.DirectionalLight(0xffffff, 2);

            mainLight.position.set(3, 8, 5);

            scene.add(mainLight);

            createRoom(THREE);
            createFurniture(THREE);

            window.addEventListener(
                "resize",
                function () {

                    camera.aspect =
                        window.innerWidth /
                        window.innerHeight;

                    camera.updateProjectionMatrix();

                    renderer.setSize(
                        window.innerWidth,
                        window.innerHeight
                    );

                }
            );

            animate();
        }

        function createRoom(THREE) {

            const floorMaterial =
                new THREE.MeshStandardMaterial({
                    color: 0x555555
                });

            const wallMaterial =
                new THREE.MeshStandardMaterial({
                    color: 0xc4c4c4
                });

            const floor =
                new THREE.Mesh(
                    new THREE.BoxGeometry(12, 0.2, 12),
                    floorMaterial
                );

            floor.position.y = -0.1;

            scene.add(floor);

            const backWall =
                new THREE.Mesh(
                    new THREE.BoxGeometry(12, 5, 0.2),
                    wallMaterial
                );

            backWall.position.set(0, 2.5, -6);

            scene.add(backWall);

            const leftWall =
                new THREE.Mesh(
                    new THREE.BoxGeometry(0.2, 5, 12),
                    wallMaterial
                );

            leftWall.position.set(-6, 2.5, 0);

            scene.add(leftWall);

            const rightWall =
                new THREE.Mesh(
                    new THREE.BoxGeometry(0.2, 5, 12),
                    wallMaterial
                );

            rightWall.position.set(6, 2.5, 0);

            scene.add(rightWall);

            const ceiling =
                new THREE.Mesh(
                    new THREE.BoxGeometry(12, 0.2, 12),
                    wallMaterial
                );

            ceiling.position.y = 5;

            scene.add(ceiling);
        }

        function createFurniture(THREE) {

            const tableMaterial =
                new THREE.MeshStandardMaterial({
                    color: 0x704b2a
                });

            const table =
                new THREE.Mesh(
                    new THREE.BoxGeometry(3, 0.3, 1.5),
                    tableMaterial
                );

            table.position.set(0, 1, -2);

            scene.add(table);

            const positions = [
                [-1.2, 0.5, -2.5],
                [1.2, 0.5, -2.5],
                [-1.2, 0.5, -1.5],
                [1.2, 0.5, -1.5]
            ];

            positions.forEach(function (position) {

                const leg =
                    new THREE.Mesh(
                        new THREE.BoxGeometry(0.2, 1, 0.2),
                        tableMaterial
                    );

                leg.position.set(
                    position[0],
                    position[1],
                    position[2]
                );

                scene.add(leg);
            });

            const boxMaterial =
                new THREE.MeshStandardMaterial({
                    color: 0x202020
                });

            const box =
                new THREE.Mesh(
                    new THREE.BoxGeometry(0.7, 0.7, 0.7),
                    boxMaterial
                );

            box.position.set(0, 1.5, -2);

            scene.add(box);

            const lamp =
                new THREE.Mesh(
                    new THREE.CylinderGeometry(
                        0.25,
                        0.25,
                        1.5,
                        24
                    ),
                    new THREE.MeshStandardMaterial({
                        color: 0xeeeeee
                    })
                );

            lamp.position.set(0, 2.4, -2);

            scene.add(lamp);
        }

        function animate() {

            requestAnimationFrame(animate);

            renderer.render(
                scene,
                camera
            );
        }

    </script>

</body>

</html>
