<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>لعبتي</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        #game {
            position: relative;
            width: 100%;
            height: 100%;
            background: #111;
            overflow: hidden;
        }

        .start-screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.35),
                    rgba(0, 0, 0, 0.75)
                ),
                #18202a;
            color: white;
            text-align: center;
        }

        .game-title {
            margin: 0;
            font-size: clamp(42px, 8vw, 90px);
            font-weight: 800;
            letter-spacing: 2px;
        }

        .game-subtitle {
            margin-top: 15px;
            font-size: clamp(16px, 3vw, 25px);
            color: #d5d5d5;
        }

        .start-button {
            margin-top: 45px;
            padding: 17px 65px;
            border: none;
            border-radius: 12px;
            background: #ffffff;
            color: #111;
            font-size: 21px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .start-button:active {
            transform: scale(0.95);
        }

        .version {
            position: absolute;
            bottom: 18px;
            left: 20px;
            color: #777;
            font-size: 12px;
        }

        #game-world {
            display: none;
            position: absolute;
            inset: 0;
            background: #202020;
        }

        .world-message {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.65);
            color: white;
            border-radius: 8px;
            font-size: 14px;
        }

        @media (orientation: portrait) {
            .start-screen::after {
                content: "يفضل تدوير الجوال للوضع الأفقي";
                position: absolute;
                bottom: 55px;
                color: #aaa;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <main id="game">

        <section class="start-screen" id="start-screen">

            <h1 class="game-title">لعبتي</h1>

            <p class="game-subtitle">
                مغامرة • استكشاف • ألغاز
            </p>

            <button class="start-button" id="start-button">
                ابدأ اللعبة
            </button>

            <div class="version">
                النسخة التجريبية
            </div>

        </section>

        <section id="game-world">

            <div class="world-message">
                بداية اللعبة
            </div>

        </section>

    </main>

    <script>
        const startButton = document.getElementById("start-button");
        const startScreen = document.getElementById("start-screen");
        const gameWorld = document.getElementById("game-world");

        startButton.addEventListener("click", function () {
            startScreen.style.display = "none";
            gameWorld.style.display = "block";
        });
    </script>

</body>

</html>
